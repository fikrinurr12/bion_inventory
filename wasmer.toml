[package]
name = "bion-inventory"
version = "0.1.0"
description = "Bion Inventory Laravel Application"

[[module]]
name = "bion-inventory"
source = "."
abi = "none"

[dependencies]
php = "8.2"

[fs]
"/app" = "."
"/tmp" = "tmp"

[commands.start]
module = "php:php"
runner = "wasi"
args = ["artisan", "serve", "--host=0.0.0.0", "--port=8080"]